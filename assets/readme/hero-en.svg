      <text x="48" y="92" text-anchor="middle" fill="#F4F7FA" font-size="14" font-weight="700">PURPOSE</text>
      <text x="48" y="111" text-anchor="middle" fill="#8D9AA7" font-size="11">context</text>
    </g>
    <g>
      <circle cx="162" cy="96" r="34" fill="#171716" stroke="#F6C453" stroke-width="2"/>
      <text x="162" y="92" text-anchor="middle" fill="#F4F7FA" font-size="14" font-weight="700">GAP</text>
      <text x="162" y="111" text-anchor="middle" fill="#8D9AA7" font-size="11">evidence</text>
    </g>
    <g>
