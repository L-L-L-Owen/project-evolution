      <text x="390" y="92" text-anchor="middle" fill="#F4F7FA" font-size="14" font-weight="700">LEARN</text>
      <text x="390" y="111" text-anchor="middle" fill="#8D9AA7" font-size="11">repeat</text>
    </g>
    <path d="M390 146C390 216 48 216 48 146" fill="none" stroke="#52616D" stroke-width="1.5" stroke-dasharray="5 7"/>
    <path d="M48 146l-8 10h16z" fill="#52616D"/>
