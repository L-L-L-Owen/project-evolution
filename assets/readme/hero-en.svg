<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">project-evolution — purpose-driven continuous improvement</title>
  <desc id="desc">A project-native loop connecting purpose, user tasks, research, hypotheses, and verification.</desc>
  <rect width="1200" height="380" rx="24" fill="#0B0F14"/>
  <path d="M56 300H1144" stroke="#24303B" stroke-width="1"/>
  <path d="M56 74H1144" stroke="#24303B" stroke-width="1"/>
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="64" y="64" fill="#5EEAD4" font-size="16" font-weight="700" letter-spacing="2">CODEX SKILL / ALPHA 14.2</text>
    <text x="64" y="142" fill="#F4F7FA" font-size="48" font-weight="700">project-evolution</text>
    <text x="64" y="184" fill="#C7D0D9" font-size="22">Improve software around its purpose,</text>
    <text x="64" y="214" fill="#C7D0D9" font-size="22">users, evidence, and repeatable verification.</text>
    <text x="64" y="270" fill="#8D9AA7" font-size="15">RESEARCH  /  OPPORTUNITY  /  HYPOTHESIS  /  VERIFY</text>
  </g>
