<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">project-evolution — evidence-led software improvement</title>
  <desc id="desc">A project-native visual showing context, purpose, evidence, hypothesis, and verification as one bounded loop.</desc>
  <rect width="1200" height="420" rx="28" fill="#F6F9FB"/>
  <path d="M58 342H1142M58 78H1142" stroke="#D8E2E7" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="64" fill="#087F76" font-size="15" font-weight="700" letter-spacing="2">CODEX SKILL · ALPHA 14.2</text>
    <text x="64" y="145" fill="#13232D" font-size="50" font-weight="700">project-evolution</text>
    <text x="64" y="190" fill="#3E515C" font-size="22">Help websites, apps, Skills, and automation</text>
    <text x="64" y="222" fill="#3E515C" font-size="22">evolve around their real purpose.</text>
    <text x="64" y="285" fill="#647681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">CONTEXT → GAP → HYPOTHESIS → VERIFY</text>
    <text x="64" y="316" fill="#647681" font-size="14">read-only · evidence-led · user-controlled</text>
  </g>
  <g transform="translate(700 106)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M46 82H388" stroke="#087F76" stroke-width="2"/>
    <path d="M388 82l-12-7v14z" fill="#087F76"/>
    <g>
      <rect x="0" y="38" width="92" height="88" rx="14" fill="#FFFFFF" stroke="#80C5BD" stroke-width="2"/>
      <text x="46" y="72" text-anchor="middle" fill="#13232D" font-size="14" font-weight="700">PROFILE</text>
      <text x="46" y="96" text-anchor="middle" fill="#647681" font-size="12">ProjectContext</text>
    </g>
    <g>
      <rect x="114" y="38" width="92" height="88" rx="14" fill="#FFFFFF" stroke="#E5C87C" stroke-width="2"/>
      <text x="160" y="72" text-anchor="middle" fill="#13232D" font-size="14" font-weight="700">MAP</text>
      <text x="160" y="96" text-anchor="middle" fill="#647681" font-size="12">FeatureMap</text>
    </g>
    <g>
      <rect x="228" y="38" width="92" height="88" rx="14" fill="#FFFFFF" stroke="#80C5BD" stroke-width="2"/>
      <text x="274" y="72" text-anchor="middle" fill="#13232D" font-size="14" font-weight="700">PROVE</text>
      <text x="274" y="96" text-anchor="middle" fill="#647681" font-size="12">Evidence</text>
    </g>
    <g>
      <rect x="342" y="38" width="92" height="88" rx="14" fill="#FFFFFF" stroke="#E5C87C" stroke-width="2"/>
      <text x="388" y="72" text-anchor="middle" fill="#13232D" font-size="14" font-weight="700">LEARN</text>
      <text x="388" y="96" text-anchor="middle" fill="#647681" font-size="12">RunResult</text>
    </g>
    <path d="M388 156C388 214 46 214 46 156" fill="none" stroke="#9FB7BE" stroke-width="1.5" stroke-dasharray="6 7"/>
    <path d="M46 156l-8 10h16z" fill="#9FB7BE"/>
    <text x="217" y="194" text-anchor="middle" fill="#647681" font-size="13">small, traceable improvement loops</text>
