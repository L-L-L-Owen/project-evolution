<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">project-evolution — evidence-led software improvement</title>
  <desc id="desc">A project-native visual showing context, purpose, evidence, hypothesis, and verification as one bounded loop.</desc>
  <rect width="1200" height="420" rx="28" fill="#0A0D11"/>
  <path d="M58 342H1142M58 78H1142" stroke="#26313A" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="64" fill="#62E6D5" font-size="15" font-weight="700" letter-spacing="2">CODEX SKILL · ALPHA 14.2</text>
    <text x="64" y="145" fill="#F4F7FA" font-size="50" font-weight="700">project-evolution</text>
    <text x="64" y="190" fill="#D0D7DE" font-size="22">A decision system for improving software</text>
    <text x="64" y="222" fill="#D0D7DE" font-size="22">around its purpose and real user tasks.</text>
    <text x="64" y="285" fill="#8795A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">CONTEXT → GAP → HYPOTHESIS → VERIFY</text>
    <text x="64" y="316" fill="#8795A3" font-size="14">read-only · evidence-led · user-controlled</text>
  </g>
  <g transform="translate(700 106)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M46 82H388" stroke="#62E6D5" stroke-width="2"/>
    <path d="M388 82l-12-7v14z" fill="#62E6D5"/>
    <g>
      <rect x="0" y="38" width="92" height="88" rx="14" fill="#111B21" stroke="#62E6D5" stroke-width="2"/>
      <text x="46" y="72" text-anchor="middle" fill="#F4F7FA" font-size="14" font-weight="700">PROFILE</text>
      <text x="46" y="96" text-anchor="middle" fill="#9CAAB6" font-size="12">ProjectContext</text>
    </g>
    <g>
      <rect x="114" y="38" width="92" height="88" rx="14" fill="#1A1813" stroke="#F6C453" stroke-width="2"/>
      <text x="160" y="72" text-anchor="middle" fill="#F4F7FA" font-size="14" font-weight="700">MAP</text>
      <text x="160" y="96" text-anchor="middle" fill="#9CAAB6" font-size="12">FeatureMap</text>
    </g>
    <g>
      <rect x="228" y="38" width="92" height="88" rx="14" fill="#111B21" stroke="#62E6D5" stroke-width="2"/>
      <text x="274" y="72" text-anchor="middle" fill="#F4F7FA" font-size="14" font-weight="700">PROVE</text>
      <text x="274" y="96" text-anchor="middle" fill="#9CAAB6" font-size="12">Evidence</text>
    </g>
    <g>
      <rect x="342" y="38" width="92" height="88" rx="14" fill="#1A1813" stroke="#F6C453" stroke-width="2"/>
      <text x="388" y="72" text-anchor="middle" fill="#F4F7FA" font-size="14" font-weight="700">LEARN</text>
      <text x="388" y="96" text-anchor="middle" fill="#9CAAB6" font-size="12">RunResult</text>
    </g>
    <path d="M388 156C388 214 46 214 46 156" fill="none" stroke="#52616D" stroke-width="1.5" stroke-dasharray="6 7"/>
    <path d="M46 156l-8 10h16z" fill="#52616D"/>
    <text x="217" y="194" text-anchor="middle" fill="#9CAAB6" font-size="13">small, traceable improvement loops</text>
  </g>
</svg>
