<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">项目进化记录链</title>
  <desc id="desc">Skill 将项目扫描结果转成可以查看、验证和复用的关联记录。</desc>
  <rect width="1200" height="300" rx="24" fill="#F6F8FA"/>
  <text x="56" y="62" fill="#17212B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">真实记录，不是抽象口号</text>
  <text x="56" y="91" fill="#5E6B76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16">每一步都会产生可查看的记录，下一轮可以继续复用。</text>
  <g transform="translate(56 132)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#0E7490" font-size="14" font-weight="700">ProjectProfile</text><text x="18" y="60" fill="#667481" font-size="12">类型 · 技术栈 · 环境</text><text x="18" y="78" fill="#667481" font-size="12">能力 · 适配器</text></g>
    <path d="M198 46H224" stroke="#7A8995" stroke-width="2"/><path d="M224 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(232)"><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#A16207" font-size="14" font-weight="700">FeatureMap</text><text x="18" y="60" fill="#667481" font-size="12">存在 · 可用 · 好用</text><text x="18" y="78" fill="#667481" font-size="12">成熟度 · 用户任务</text></g>
    <path d="M430 46H456" stroke="#7A8995" stroke-width="2"/><path d="M456 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(464)"><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#0E7490" font-size="14" font-weight="700">Evidence</text><text x="18" y="60" fill="#667481" font-size="12">L0 静态 → L4 线上</text><text x="18" y="78" fill="#667481" font-size="12">来源 · 方法 · 结果</text></g>
    <path d="M662 46H688" stroke="#7A8995" stroke-width="2"/><path d="M688 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(696)"><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#A16207" font-size="14" font-weight="700">Hypothesis</text><text x="18" y="60" fill="#667481" font-size="12">基线 · 目标 · 风险</text><text x="18" y="78" fill="#667481" font-size="12">验收 · 回退</text></g>
    <path d="M894 46H920" stroke="#7A8995" stroke-width="2"/><path d="M920 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(928)"><rect width="160" height="92" rx="12" fill="#17212B" stroke="#17212B"/><text x="18" y="34" fill="#62E6D5" font-size="14" font-weight="700">RunResult</text><text x="18" y="60" fill="#D0D7DE" font-size="12">支持 · 失败</text><text x="18" y="78" fill="#D0D7DE" font-size="12">不确定 · 重开</text></g>
  </g>
</svg>
