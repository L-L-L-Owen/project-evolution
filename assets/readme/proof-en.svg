<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Project Evolution record chain</title>
  <desc id="desc">The Skill turns a repository scan into linked records that can be reviewed and verified.</desc>
  <rect width="1200" height="300" rx="24" fill="#F6F8FA"/>
  <text x="56" y="62" fill="#17212B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700">Real records, not abstract promises</text>
  <text x="56" y="91" fill="#5E6B76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Each stage creates a reviewable artifact that the next run can reuse.</text>
  <g transform="translate(56 132)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#0E7490" font-size="14" font-weight="700">ProjectProfile</text><text x="18" y="60" fill="#667481" font-size="12">type · stack · env</text><text x="18" y="78" fill="#667481" font-size="12">capabilities · adapter</text></g>
    <path d="M198 46H224" stroke="#7A8995" stroke-width="2"/><path d="M224 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(232)"><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#A16207" font-size="14" font-weight="700">FeatureMap</text><text x="18" y="60" fill="#667481" font-size="12">exists · usable · useful</text><text x="18" y="78" fill="#667481" font-size="12">maturity · user task</text></g>
    <path d="M430 46H456" stroke="#7A8995" stroke-width="2"/><path d="M456 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(464)"><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#0E7490" font-size="14" font-weight="700">Evidence</text><text x="18" y="60" fill="#667481" font-size="12">L0 static → L4 live</text><text x="18" y="78" fill="#667481" font-size="12">source · method · result</text></g>
    <path d="M662 46H688" stroke="#7A8995" stroke-width="2"/><path d="M688 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(696)"><rect width="190" height="92" rx="12" fill="#FFFFFF" stroke="#B8C4CD"/><text x="18" y="34" fill="#A16207" font-size="14" font-weight="700">Hypothesis</text><text x="18" y="60" fill="#667481" font-size="12">baseline · target · risk</text><text x="18" y="78" fill="#667481" font-size="12">acceptance · rollback</text></g>
    <path d="M894 46H920" stroke="#7A8995" stroke-width="2"/><path d="M920 46l-8-5v10z" fill="#7A8995"/>
    <g transform="translate(928)"><rect width="160" height="92" rx="12" fill="#17212B" stroke="#17212B"/><text x="18" y="34" fill="#62E6D5" font-size="14" font-weight="700">RunResult</text><text x="18" y="60" fill="#D0D7DE" font-size="12">supported · failed</text><text x="18" y="78" fill="#D0D7DE" font-size="12">inconclusive · reopen</text></g>
  </g>
</svg>
